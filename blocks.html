<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alive Readme: tables and trees</title>
<style>
:root{--bg:#0f0d1a;--card:#181528;--bd:#2a2545;--tx:#f0eeff;--mu:#9d94c4;--ac:#7c6cff;--ok:#3ecf8e}
@media (prefers-color-scheme:light){:root{--bg:#f6f5ff;--card:#fff;--bd:#dcd8f5;--tx:#1d1a33;--mu:#6b6590}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:1040px;margin:0 auto;padding:36px 20px 60px}h1{margin:0;font-size:2rem}.sub{color:var(--mu);margin:4px 0 20px}.sub a{color:var(--ac)}
.layout{display:grid;gap:20px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}@media(max-width:820px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:16px}
label,.lbl{display:block;font-size:.8rem;color:var(--mu);margin:12px 0 4px}
textarea,input[type=text]{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:.85rem;resize:vertical}
input[type=color]{width:100%;height:38px;padding:2px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.row{display:flex;gap:10px}.row>*{flex:1}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:6px 14px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
.pv{display:flex;align-items:center;justify-content:center;min-height:90px;border-radius:10px;margin-bottom:10px;padding:12px;overflow:auto}
.primary{width:100%;margin-top:8px;padding:11px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}.primary.done{background:var(--ok)}
.note{font-size:.8rem;color:var(--mu);margin:6px 0 0}#warn{display:none;border:1px solid #e0a030;border-radius:8px;padding:8px 12px;margin-top:10px;font-size:.85rem}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.hide{display:none}
</style></head><body><main>
<h1>Tables &amp; trees</h1><p class="sub">Styled SVG tables and folder trees for your README. <a href="./">← Button maker</a></p>
<div class="seg" id="kind" style="margin-bottom:16px"></div>
<div class="layout">
<section class="card">
  <label for="data" id="datalbl"></label><textarea id="data" rows="10" spellcheck="false"></textarea>
  <p class="note" id="help"></p>
  <span class="lbl">Theme</span><div class="seg" id="theme"></div>
  <div class="row" id="colors"></div>
  <label id="zrow"><input id="zebra" type="checkbox" checked> Striped rows</label>
</section>
<section class="card">
  <div class="pv" style="background:#0d1117"><img id="pd" alt=""></div>
  <div class="pv" style="background:#fff"><img id="pl" alt=""></div>
  <label for="md">Markdown (paste into your README)</label><textarea id="md" rows="4" readonly></textarea>
  <button class="primary" id="copy">Copy Markdown</button><div id="warn"></div>
</section></div></main>
<script type="module">
import { renderTable } from "./buttons/src/table-svg.js";
import { renderTree } from "./buttons/src/tree-svg.js";
const API_BASE = "https://alive-readme-buttons.spookyminecraftgamer.workers.dev";
const $ = id => document.getElementById(id);
const K = {
  table: { name: "Table", fn: renderTable, lbl: "Table rows (first row is the header)", help: "One row per line. Separate cells with the | character.",
    data: "Option|What it does|Default\ntext|Button label|Button\nfill|solid, gradient or outline|solid\nanim|shine or pulse|none", head: "#6c63ff", hfg: "#ffffff" },
  tree: { name: "Tree", fn: renderTree, lbl: "Folder tree", help: "Indent with 2 spaces per level. End folders with /. Add  # a note  after a name for a comment.",
    data: "Alive-Readme/\n  index.html  # button maker\n  buttons/\n    src/\n      button-svg.js\n      brand-icons.js  # logos\n    package.json\n  README.md", folder: "#79c0ff" },
};
const S = { kind: "table", theme: "dark" };
for (const k in K) K[k].cur = { ...K[k] };
const seg = (el, items, key, cur) => { $(el).innerHTML = items.map(([v, n]) => `<button type="button" data-v="${v}" aria-pressed="${cur() === v}">${n}</button>`).join(""); };
function drawColors() {
  const k = K[S.kind];
  $("colors").innerHTML = S.kind === "table"
    ? `<div><label for="head">Header colour</label><input id="head" type="color" value="${k.head}"></div><div><label for="hfg">Header text</label><input id="hfg" type="color" value="${k.hfg}"></div>`
    : `<div><label for="folder">Folder colour</label><input id="folder" type="color" value="${k.folder}"></div>`;
  $("zrow").classList.toggle("hide", S.kind !== "table");
}
function load() {
  const k = K[S.kind]; $("datalbl").textContent = k.lbl; $("help").textContent = k.help; $("data").value = k.data;
  seg("kind", Object.entries(K).map(([v, x]) => [v, x.name]), "kind", () => S.kind);
  seg("theme", [["dark", "Dark"], ["light", "Light"]], "theme", () => S.theme);
  drawColors(); update();
}
function update() {
  const k = K[S.kind], o = { data: $("data").value, theme: S.theme };
  k.data = o.data;
  if (S.kind === "table") { k.head = $("head").value; k.hfg = $("hfg").value; o.head = k.head.slice(1); o.hfg = k.hfg.slice(1); if (!$("zebra").checked) o.zebra = "off"; }
  else { k.folder = $("folder").value; o.folder = k.folder.slice(1); }
  const src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(k.fn(o));
  $("pd").src = src; $("pl").src = src;
  const url = `${API_BASE}/${S.kind}.svg?${new URLSearchParams(o)}`;
  $("md").value = `![${k.name}](${url})`;
  $("warn").style.display = url.length > 1800 ? "block" : "none";
  $("warn").textContent = "This URL is very long and may not load in some READMEs. Try fewer rows.";
}
document.addEventListener("click", e => {
  const b = e.target.closest(".seg button"); if (!b) return;
  if (b.parentElement.id === "kind") { S.kind = b.dataset.v; load(); }
  else { S.theme = b.dataset.v; seg("theme", [["dark", "Dark"], ["light", "Light"]], "theme", () => S.theme); update(); }
});
$("data").addEventListener("input", update); $("zebra").addEventListener("input", update);
$("colors").addEventListener("input", update);
$("copy").addEventListener("click", async () => {
  const b = $("copy");
  try { await navigator.clipboard.writeText($("md").value); b.textContent = "Copied! Now paste it in your README"; b.classList.add("done"); }
  catch { b.textContent = "Copy failed. Select the text and copy it"; }
  setTimeout(() => { b.textContent = "Copy Markdown"; b.classList.remove("done"); }, 2200);
});
load();
</script></body></html>
